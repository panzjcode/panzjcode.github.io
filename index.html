<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致 小菊 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
:root {
    --deep-space: #000018;
    --star-white: #e8e8ff;
    --nebula-purple: #7b5ea7;
    --nebula-blue: #4a6fa5;
    --nebula-pink: #c77d9e;
    --gold: #e8d5a3;
    --text: #c8c8e0;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Serif SC', serif;
    background: var(--deep-space);
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
}

/* ===== Canvas Layers ===== */
canvas#nebula   { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
canvas#stars    { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
canvas#meteors  { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }

/* ===== Cursor Glow ===== */
#cursor-glow {
    position: fixed; pointer-events: none; z-index: 200;
    width: 350px; height: 350px; border-radius: 50%;
    background: radial-gradient(circle, rgba(180,160,220,0.06) 0%, rgba(100,120,200,0.03) 30%, transparent 60%);
    transform: translate(-50%, -50%); opacity: 0; transition: opacity 0.3s;
}

/* ===== Shooting star on click ===== */
.click-star {
    position: fixed; pointer-events: none; z-index: 250;
    width: 2px; height: 2px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 6px #fff, 0 0 12px #c8d0ff;
    animation: clickStarFade 1.2s ease-out forwards;
}
@keyframes clickStarFade {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%,calc(-50% - 60px)) scale(0); opacity: 0; }
}

/* ===== Audio Button ===== */
#audio-btn {
    position: fixed; top: 28px; right: 28px; z-index: 100;
    width: 48px; height: 48px; border-radius: 50%;
    border: 1px solid rgba(180,160,220,0.3);
    background: rgba(10,8,30,0.6);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: #c8c0e8; cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.4s ease; outline: none;
    box-shadow: 0 0 20px rgba(120,100,180,0.15);
}
#audio-btn:hover {
    border-color: rgba(200,180,240,0.5);
    box-shadow: 0 0 32px rgba(140,120,200,0.35), 0 0 64px rgba(160,140,220,0.15);
}
#audio-btn.playing {
    border-color: rgba(200,180,240,0.5);
    box-shadow: 0 0 24px rgba(180,160,220,0.4), 0 0 48px rgba(140,120,200,0.2);
    animation: audioGlow 3s ease-in-out infinite;
}
@keyframes audioGlow {
    0%, 100% { box-shadow: 0 0 24px rgba(180,160,220,0.4); }
    50% { box-shadow: 0 0 40px rgba(200,180,255,0.7), 0 0 80px rgba(160,140,220,0.3); }
}

/* ===== Sections ===== */
section {
    position: relative; z-index: 10;
    min-height: 100vh;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 80px 24px; text-align: center;
}
.section-inner { max-width: 720px; width: 100%; }

/* ===== COUNTER ===== */
#counter .counter-label {
    font-size: 1.15rem; letter-spacing: 0.2em; opacity: 0.7; margin-bottom: 36px; font-weight: 300;
    color: var(--star-white);
    text-shadow: 0 0 15px rgba(200,180,240,0.5), 0 0 30px rgba(160,140,220,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
}
#counter .counter-subtitle {
    font-size: 0.9rem; letter-spacing: 0.12em; opacity: 0.5; margin-top: 32px;
    color: var(--star-white);
    text-shadow: 0 0 12px rgba(180,160,220,0.35);
}
#counter .counter-row {
    display: flex; gap: 16px; justify-content: center; align-items: baseline; flex-wrap: wrap;
}
#counter .digit-block {
    text-align: center; min-width: 90px;
    background: rgba(20,15,50,0.25);
    border: 1px solid rgba(180,160,220,0.15);
    border-radius: 20px; padding: 24px 18px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: 0 0 30px rgba(100,80,160,0.06), inset 0 0 30px rgba(120,100,180,0.03);
    position: relative; overflow: hidden;
}
#counter .digit-block::after {
    content: ''; position: absolute; top: 0; left: 20%; right: 20%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(200,180,240,0.4), transparent);
}
#counter .digit-num {
    font-size: clamp(2.8rem, 8vw, 6rem);
    font-weight: 200;
    color: transparent;
    background: linear-gradient(180deg,
        rgba(255,255,255,0.95),
        rgba(220,200,255,0.85),
        rgba(180,160,230,0.7)
    );
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(200,180,240,0.5)) drop-shadow(0 0 45px rgba(160,140,220,0.3));
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-variant-numeric: tabular-nums;
    line-height: 1;
}
#counter .counter-divider {
    font-size: 2rem;
    color: rgba(220,210,255,0.5);
    font-weight: 100;
    align-self: center;
    text-shadow: 0 0 12px rgba(180,160,220,0.4);
    margin: 0 2px;
}

/* ===== LOVE LETTER ===== */
#loveletter .letter-inner {
    text-align: left; line-height: 2.2; padding: 20px 0;
}
#loveletter .letter-inner p {
    font-size: 1.15rem; letter-spacing: 0.05em; color: #d0c8e8;
    opacity: 0; transform: translateY(30px);
    transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    margin-bottom: 18px;
}
#loveletter .letter-inner p.visible {
    opacity: 0.8; transform: translateY(0);
}
#loveletter .letter-inner .letter-salute {
    font-size: 1.3rem; color: var(--star-white);
    text-shadow: 0 0 8px rgba(200,180,240,0.4);
}
#loveletter .letter-inner .letter-signature {
    text-align: right; color: var(--gold); font-size: 1.2rem;
    margin-top: 32px;
    text-shadow: 0 0 10px rgba(232,213,163,0.4);
}

/* ===== FINALE ===== */
#finale .finale-heart {
    font-size: 4rem; display: block;
    animation: cosmicBeat 1.1s ease-in-out infinite;
    cursor: default; user-select: none;
    filter: drop-shadow(0 0 20px rgba(200,160,200,0.6)) drop-shadow(0 0 40px rgba(160,140,220,0.4));
}
@keyframes cosmicBeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.28); }
    28% { transform: scale(1); }
    42% { transform: scale(1.18); }
    56% { transform: scale(1); }
}
#finale .finale-520 {
    font-size: clamp(3.5rem, 12vw, 8rem);
    font-weight: 200; letter-spacing: 0.05em; margin: 28px 0; line-height: 1;
    color: transparent;
    background: linear-gradient(180deg,
        rgba(255,255,255,0.9),
        rgba(220,200,255,0.8),
        rgba(180,160,230,0.6)
    );
    -webkit-background-clip: text;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(200,180,240,0.6)) drop-shadow(0 0 60px rgba(160,140,220,0.3));
}
@keyframes nameShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
}
@keyframes nameFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(var(--tilt, 0deg)); }
}
#finale .finale-name {
    font-family: 'Ma Shan Zheng', 'ZCOOL XiaoWei', 'Noto Serif SC', serif;
    font-size: clamp(3rem, 11vw, 6.5rem);
    font-weight: 400;
    margin: 16px 0 0;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(8px, 2.5vw, 20px);
    position: relative;
    padding: 0 8px 12px;
}
#finale .finale-name::before,
#finale .finale-name::after {
    content: '';
    position: absolute;
    bottom: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,213,163,0.6), rgba(200,180,240,0.5), transparent);
    box-shadow: 0 0 12px rgba(232,213,163,0.35);
}
#finale .finale-name::before {
    left: 5%;
    right: 55%;
}
#finale .finale-name::after {
    left: 55%;
    right: 5%;
}
#finale .finale-name .name-char {
    display: inline-block;
    background: linear-gradient(
        160deg,
        #ffffff 0%,
        #f8ecd4 22%,
        #f0d0e8 45%,
        #d8c0ff 68%,
        #fff8f0 100%
    );
    background-size: 220% 220%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-stroke: 1px rgba(255, 255, 255, 0.12);
    paint-order: stroke fill;
    filter: drop-shadow(0 0 18px rgba(232, 213, 163, 0.45))
            drop-shadow(0 0 32px rgba(200, 180, 240, 0.35))
            drop-shadow(0 2px 4px rgba(0, 0, 0, 0.35));
    animation: nameShimmer 5s ease-in-out infinite, nameFloat 4s ease-in-out infinite;
    animation-delay: calc(var(--i) * 0.2s), calc(var(--i) * 0.2s + 0.3s);
}
#finale .finale-name .name-char:nth-child(1) { --tilt: -2deg; }
#finale .finale-name .name-char:nth-child(2) { --tilt: 1deg; }
#finale .finale-name .name-char:nth-child(3) { --tilt: -1deg; }

/* ===== Scroll Progress ===== */
#scroll-progress {
    position: fixed; top: 0; left: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(200,180,240,0.5), rgba(232,213,163,0.4));
    z-index: 400; box-shadow: 0 0 6px rgba(180,160,220,0.4);
    transition: width 0.08s linear; border-radius: 0 2px 2px 0;
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
    section { padding: 60px 20px; }
    #counter .digit-block { min-width: 68px; padding: 16px 10px; }
    #counter .counter-row { gap: 8px; }
    #loveletter .letter-inner p { font-size: 1rem; line-height: 2; }
    #audio-btn { top: 16px; right: 16px; width: 42px; height: 42px; font-size: 1rem; }
}
</style>
</head>
<body>

<canvas id="nebula"></canvas>
<canvas id="stars"></canvas>
<canvas id="meteors"></canvas>
<div id="cursor-glow"></div>
<div id="scroll-progress"></div>

<button id="audio-btn" title="播放音乐">🎵</button>

<section id="loveletter">
    <div class="section-inner">
        <div class="letter-inner">
            <p class="letter-salute" data-animate>亲爱的小菊：</p>
            <p data-animate>还记得 2026 年 1 月 29 日那个傍晚吗？</p>
            <p data-animate>从相识的那一刻起，</p>
            <p data-animate>你就悄悄住进了我的心里。</p>
            <p data-animate>你一笑，便是我心底最好的天气；</p>
            <p data-animate>你在身边，再平常的日子也闪着光。</p>
            <p data-animate>你的声音、你的脾气、你的小习惯，</p>
            <p data-animate>都是我想认真珍藏的温柔细节。</p>
            <p data-animate>我不擅长说很多漂亮话，</p>
            <p data-animate>只想牵着你的手，把今后的每一天都过成「和你一起」。</p>
            <p data-animate>春夏秋冬，我都想陪在你身边。</p>
            <p class="letter-signature" data-animate>—— 永远爱你的 杰</p>
        </div>
    </div>
</section>

<section id="counter">
    <div class="section-inner">
        <div class="counter-label">
            <span style="margin-right: 1em;">自我们相识以来，已经</span>
            <div class="counter-row">
                <div class="digit-block">
                    <div class="digit-num" id="days">0</div>
                </div>
            </div>
            <span class="counter-divider" style="margin-left: 0.3em;">天</span>
        </div>
        <div class="counter-row">
            <div class="digit-block">
                <div class="digit-num" id="hours">00</div>
            </div>
            <span class="counter-divider">时</span>
            <div class="digit-block">
                <div class="digit-num" id="minutes">00</div>
            </div>
            <span class="counter-divider">分</span>
            <div class="digit-block">
                <div class="digit-num" id="seconds">00</div>
            </div>
            <span class="counter-divider">秒</span>
        </div>
        <p class="counter-subtitle">从那个傍晚到现在，每一秒都因你而珍贵</p>
    </div>
</section>

<section id="finale">
    <div class="section-inner">
        <h2 class="finale-520">我爱你小菊</h2>
        <span class="finale-heart">❤️</span>
        <h3 class="finale-name" aria-label="鲁瑞珍">
            <span class="name-char" style="--i:0">鲁</span>
            <span class="name-char" style="--i:1">瑞</span>
            <span class="name-char" style="--i:2">珍</span>
        </h3>
    </div>
</section>

<script>
// ==========================================
//  NEBULA CANVAS — swirling cosmic clouds
// ==========================================
const nebulaCanvas = document.getElementById('nebula');
const nctx = nebulaCanvas.getContext('2d');
let nw, nh;

function resizeNebula() {
    nw = nebulaCanvas.width = window.innerWidth;
    nh = nebulaCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeNebula);
resizeNebula();

const nebulaBlobs = [];
for (let i = 0; i < 6; i++) {
    nebulaBlobs.push({
        x: Math.random() * nw,
        y: Math.random() * nh,
        baseX: Math.random() * nw,
        baseY: Math.random() * nh,
        radius: 150 + Math.random() * 400,
        hue: [260, 280, 300, 220, 250, 290][i],
        alpha: 0.015 + Math.random() * 0.025,
        speedX: (Math.random() - 0.5) * 0.15,
        speedY: (Math.random() - 0.5) * 0.15,
        phase: Math.random() * Math.PI * 2,
        amplitude: 30 + Math.random() * 60,
    });
}

function drawNebula(time) {
    nctx.clearRect(0, 0, nw, nh);
    for (const blob of nebulaBlobs) {
        blob.x = blob.baseX + Math.cos(time * 0.0003 + blob.phase) * blob.amplitude;
        blob.y = blob.baseY + Math.sin(time * 0.0004 + blob.phase) * blob.amplitude;

        const grad = nctx.createRadialGradient(blob.x, blob.y, 0, blob.x, blob.y, blob.radius);
        grad.addColorStop(0, `hsla(${blob.hue}, 50%, 60%, ${blob.alpha * 2})`);
        grad.addColorStop(0.4, `hsla(${blob.hue}, 40%, 40%, ${blob.alpha})`);
        grad.addColorStop(0.7, `hsla(${blob.hue}, 30%, 20%, ${blob.alpha * 0.4})`);
        grad.addColorStop(1, 'transparent');

        nctx.fillStyle = grad;
        nctx.beginPath();
        nctx.arc(blob.x, blob.y, blob.radius, 0, Math.PI * 2);
        nctx.fill();
    }
    requestAnimationFrame(drawNebula);
}
requestAnimationFrame(drawNebula);

// ==========================================
//  STARS CANVAS — multi-layer starfield
// ==========================================
const starsCanvas = document.getElementById('stars');
const sctx = starsCanvas.getContext('2d');
let sw, sh;

function resizeStars() {
    sw = starsCanvas.width = window.innerWidth;
    sh = starsCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeStars);
resizeStars();

const distantStars = [];
for (let i = 0; i < 400; i++) {
    distantStars.push({
        x: Math.random() * sw,
        y: Math.random() * sh,
        r: Math.random() * 0.8 + 0.2,
        twinkleSpeed: Math.random() * 0.003 + 0.001,
        twinklePhase: Math.random() * Math.PI * 2,
        baseAlpha: Math.random() * 0.5 + 0.3,
    });
}

const brightStars = [];
for (let i = 0; i < 50; i++) {
    brightStars.push({
        x: Math.random() * sw,
        y: Math.random() * sh,
        r: Math.random() * 2 + 1,
        twinkleSpeed: Math.random() * 0.004 + 0.002,
        twinklePhase: Math.random() * Math.PI * 2,
        baseAlpha: Math.random() * 0.4 + 0.5,
        hasFlare: Math.random() > 0.5,
    });
}

const constellations = [];
for (let c = 0; c < 5; c++) {
    const points = [];
    const cx = Math.random() * sw;
    const cy = Math.random() * sh;
    const count = 4 + Math.floor(Math.random() * 5);
    for (let i = 0; i < count; i++) {
        points.push({
            x: cx + (Math.random() - 0.5) * 300,
            y: cy + (Math.random() - 0.5) * 300,
        });
    }
    constellations.push({ points, alpha: 0.03 + Math.random() * 0.04 });
}

function drawStars(time) {
    sctx.clearRect(0, 0, sw, sh);

    for (const star of distantStars) {
        const alpha = star.baseAlpha + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.2;
        sctx.fillStyle = `rgba(220,220,255,${Math.max(0.1, alpha)})`;
        sctx.beginPath();
        sctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        sctx.fill();
    }

    for (const star of brightStars) {
        const alpha = star.baseAlpha + Math.sin(time * star.twinkleSpeed + star.twinklePhase) * 0.3;
        const x = star.x, y = star.y;

        const glow = sctx.createRadialGradient(x, y, 0, x, y, star.r * 8);
        glow.addColorStop(0, `rgba(220,210,255,${Math.max(0.1, alpha) * 0.5})`);
        glow.addColorStop(1, 'transparent');
        sctx.fillStyle = glow;
        sctx.beginPath();
        sctx.arc(x, y, star.r * 8, 0, Math.PI * 2);
        sctx.fill();

        sctx.fillStyle = `rgba(255,250,255,${Math.max(0.1, alpha)})`;
        sctx.beginPath();
        sctx.arc(x, y, star.r, 0, Math.PI * 2);
        sctx.fill();

        if (star.hasFlare && alpha > 0.5) {
            const flareAlpha = (alpha - 0.5) * 0.4;
            sctx.strokeStyle = `rgba(220,210,255,${flareAlpha})`;
            sctx.lineWidth = 0.5;
            for (let angle = 0; angle < 4; angle++) {
                const rad = angle * Math.PI / 2;
                sctx.beginPath();
                sctx.moveTo(x + Math.cos(rad) * star.r * 2, y + Math.sin(rad) * star.r * 2);
                sctx.lineTo(x + Math.cos(rad) * star.r * 12, y + Math.sin(rad) * star.r * 12);
                sctx.stroke();
            }
        }
    }

    for (const { points, alpha } of constellations) {
        sctx.strokeStyle = `rgba(180,160,220,${alpha})`;
        sctx.lineWidth = 0.5;
        for (let i = 0; i < points.length; i++) {
            for (let j = i + 1; j < points.length; j++) {
                const dx = points[i].x - points[j].x;
                const dy = points[i].y - points[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 180) {
                    sctx.beginPath();
                    sctx.moveTo(points[i].x, points[i].y);
                    sctx.lineTo(points[j].x, points[j].y);
                    sctx.stroke();
                }
            }
        }
    }

    requestAnimationFrame(drawStars);
}
requestAnimationFrame(drawStars);

window.addEventListener('resize', () => {
    resizeStars();
    for (const s of distantStars) { s.x = Math.random() * sw; s.y = Math.random() * sh; }
    for (const s of brightStars) { s.x = Math.random() * sw; s.y = Math.random() * sh; }
    for (const c of constellations) {
        const cx = Math.random() * sw;
        const cy = Math.random() * sh;
        for (const p of c.points) {
            p.x = cx + (Math.random() - 0.5) * 300;
            p.y = cy + (Math.random() - 0.5) * 300;
        }
    }
});

// ==========================================
//  METEORS CANVAS — shooting stars
// ==========================================
const meteorsCanvas = document.getElementById('meteors');
const mctx = meteorsCanvas.getContext('2d');
let mw, mh;

function resizeMeteors() {
    mw = meteorsCanvas.width = window.innerWidth;
    mh = meteorsCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeMeteors);
resizeMeteors();

const meteors = [];
const MAX_METEORS = 4;

function spawnMeteor() {
    return {
        x: Math.random() * mw,
        y: Math.random() * mh * 0.4,
        vx: (Math.random() - 0.3) * 1.2 + 0.6,
        vy: Math.random() * 1.5 + 1,
        length: 40 + Math.random() * 80,
        life: 1,
        decay: 0.003 + Math.random() * 0.006,
        width: 1 + Math.random() * 1.5,
    };
}

for (let i = 0; i < 2; i++) meteors.push(spawnMeteor());

setInterval(() => {
    if (meteors.length < MAX_METEORS && Math.random() > 0.3) {
        meteors.push(spawnMeteor());
    }
}, 3000);

function drawMeteors(time) {
    mctx.clearRect(0, 0, mw, mh);

    for (let i = meteors.length - 1; i >= 0; i--) {
        const m = meteors[i];
        m.x += m.vx;
        m.y += m.vy;
        m.life -= m.decay;

        if (m.life <= 0) {
            meteors.splice(i, 1);
            continue;
        }

        const angle = Math.atan2(m.vy, m.vx);
        const tailX = m.x - Math.cos(angle) * m.length;
        const tailY = m.y - Math.sin(angle) * m.length;

        const grad = mctx.createLinearGradient(m.x, m.y, tailX, tailY);
        grad.addColorStop(0, `rgba(255,255,255,${m.life * 0.9})`);
        grad.addColorStop(0.1, `rgba(220,210,255,${m.life * 0.6})`);
        grad.addColorStop(1, 'transparent');

        mctx.strokeStyle = grad;
        mctx.lineWidth = m.width * m.life;
        mctx.lineCap = 'round';
        mctx.beginPath();
        mctx.moveTo(m.x, m.y);
        mctx.lineTo(tailX, tailY);
        mctx.stroke();

        mctx.fillStyle = `rgba(255,255,255,${m.life})`;
        mctx.shadowColor = `rgba(200,180,255,${m.life * 0.8})`;
        mctx.shadowBlur = 8;
        mctx.beginPath();
        mctx.arc(m.x, m.y, m.width * 1.2, 0, Math.PI * 2);
        mctx.fill();
        mctx.shadowBlur = 0;
    }

    requestAnimationFrame(drawMeteors);
}
requestAnimationFrame(drawMeteors);

// ==========================================
//  MOUSE — cosmic glow follow + click stars
// ==========================================
let mouseX = -1000, mouseY = -1000;

document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    const glow = document.getElementById('cursor-glow');
    glow.style.left = e.clientX + 'px';
    glow.style.top = e.clientY + 'px';
    glow.style.opacity = '1';
});
document.addEventListener('mouseleave', () => {
    document.getElementById('cursor-glow').style.opacity = '0';
});
document.addEventListener('touchmove', (e) => {
    const g = document.getElementById('cursor-glow');
    g.style.left = e.touches[0].clientX + 'px';
    g.style.top = e.touches[0].clientY + 'px';
    g.style.opacity = '1';
}, { passive: true });
document.addEventListener('touchend', () => {
    document.getElementById('cursor-glow').style.opacity = '0';
});

document.addEventListener('click', (e) => {
    if (e.target.closest('#audio-btn')) return;

    for (let i = 0; i < 5; i++) {
        const star = document.createElement('div');
        star.className = 'click-star';
        star.style.left = (e.clientX + (Math.random()-0.5)*30) + 'px';
        star.style.top = (e.clientY + (Math.random()-0.5)*30) + 'px';
        star.style.animationDelay = (Math.random() * 0.2) + 's';
        star.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
        document.body.appendChild(star);
        setTimeout(() => star.remove(), 1500);
    }
});

// ==========================================
//  TIME COUNTER
// ==========================================
const firstMeet = new Date('2026-01-29T19:00:00');
const daysEl = document.getElementById('days');
const hoursEl = document.getElementById('hours');
const minutesEl = document.getElementById('minutes');
const secondsEl = document.getElementById('seconds');

function updateCounter() {
    const diff = Date.now() - firstMeet;
    daysEl.textContent = Math.floor(diff / 86400000);
    hoursEl.textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
    minutesEl.textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    secondsEl.textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
}
setInterval(updateCounter, 1000);
updateCounter();

// ==========================================
//  SCROLL → TEXT REVEAL
// ==========================================
const msgObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
    });
}, { threshold: 0.5, rootMargin: '0px 0px -40px 0px' });
document.querySelectorAll('[data-animate]').forEach(el => msgObserver.observe(el));

// ==========================================
//  SCROLL PROGRESS
// ==========================================
const progressBar = document.getElementById('scroll-progress');
window.addEventListener('scroll', () => {
    const pct = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
    progressBar.style.width = Math.min(100, Math.max(0, pct)) + '%';
});

// ==========================================
//  FINALE — cosmic starburst
// ==========================================
let burstFired = false;
const finaleObserver = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting && !burstFired) {
        burstFired = true;
        cosmicBurst();
    }
}, { threshold: 0.5 });
finaleObserver.observe(document.getElementById('finale'));

function cosmicBurst() {
    const emojis = ['❤️', '💕', '💖', '💗', '💓', '💝', '💘', '✨', '🌟', '💫', '⭐', '🌙'];
    for (let i = 0; i < 80; i++) {
        setTimeout(() => {
            const el = document.createElement('span');
            el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            const angle = Math.random() * Math.PI * 2;
            const dist = 150 + Math.random() * 500;
            const dur = 1.5 + Math.random() * 3.5;
            const rot = (Math.random() - 0.5) * 900;
            el.style.cssText = `
                position:fixed;pointer-events:none;z-index:300;
                font-size:${18 + Math.random() * 32}px;
                left:50%;top:50%;
                animation:starBurst ${dur}s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
                --dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;--rot:${rot}deg;
            `;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), dur * 1000 + 500);
        }, i * 30);
    }

    const ringCanvas = document.createElement('canvas');
    ringCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:299;';
    document.body.appendChild(ringCanvas);
    ringCanvas.width = window.innerWidth;
    ringCanvas.height = window.innerHeight;
    const rctx = ringCanvas.getContext('2d');
    const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    let radius = 0;
    const maxR = Math.max(window.innerWidth, window.innerHeight) * 0.7;

    function drawRing() {
        rctx.clearRect(0, 0, ringCanvas.width, ringCanvas.height);
        radius += 10;
        if (radius > maxR) { ringCanvas.remove(); return; }
        const alpha = 1 - radius / maxR;

        rctx.strokeStyle = `rgba(200,180,240,${alpha * 0.5})`;
        rctx.lineWidth = 2;
        rctx.shadowColor = `rgba(180,160,230,${alpha})`;
        rctx.shadowBlur = 25;
        rctx.beginPath();
        rctx.arc(cx, cy, radius, 0, Math.PI * 2);
        rctx.stroke();
        rctx.shadowBlur = 0;

        if (radius > 40) {
            rctx.strokeStyle = `rgba(232,213,163,${alpha * 0.35})`;
            rctx.shadowColor = `rgba(232,213,163,${alpha * 0.5})`;
            rctx.shadowBlur = 15;
            rctx.beginPath();
            rctx.arc(cx, cy, radius * 0.65, 0, Math.PI * 2);
            rctx.stroke();
            rctx.shadowBlur = 0;
        }

        requestAnimationFrame(drawRing);
    }
    requestAnimationFrame(drawRing);

    if (!document.getElementById('burstStyle')) {
        const s = document.createElement('style');
        s.id = 'burstStyle';
        s.textContent = `
            @keyframes starBurst {
                0%   { transform:translate(-50%,-50%) scale(0.2) rotate(0deg); opacity:1; }
                40%  { opacity:0.9; }
                100% { transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.4) rotate(var(--rot)); opacity:0; }
            }
        `;
        document.head.appendChild(s);
    }
}

// ==========================================
//  AUDIO
// ==========================================
const bgm = document.createElement('audio');
bgm.loop = true;
bgm.volume = 0.35;
bgm.preload = 'auto';
bgm.src = '慢慢喜欢你-钢琴版.mp3';

const audioBtn = document.getElementById('audio-btn');
let isPlaying = false;

function toggleAudio() {
    if (isPlaying) {
        bgm.pause(); isPlaying = false;
        audioBtn.classList.remove('playing');
        audioBtn.textContent = '🔇';
    } else {
        bgm.play().then(() => {
            isPlaying = true;
            audioBtn.classList.add('playing');
            audioBtn.textContent = '🎵';
        }).catch(() => { audioBtn.textContent = '🔇'; });
    }
}
audioBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleAudio(); });

function tryAutoPlay() {
    if (!isPlaying) {
        bgm.play().then(() => {
            isPlaying = true;
            audioBtn.classList.add('playing');
            audioBtn.textContent = '🎵';
        }).catch(() => {});
    }
}
['click', 'scroll', 'keydown', 'touchstart'].forEach(evt => {
    document.addEventListener(evt, tryAutoPlay, { once: true });
});
</script>
